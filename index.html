if(G)$('#cr').onclick=registro;else{$('#ed').onclick=editar;$('#del').onclick=e=>{if(e.target.dataset.c){LS.d('ng_u_'+u.id);UD.list=UD.list.filter(x=>x.id!=u.id);UD.cur='';udS();SS.s('ng_ok','');acceso()}else{e.target.dataset.c=1;e.target.textContent='¿Seguro? Toca de nuevo: se borra todo su progreso'}}}}
function recs(lv){g++;const sc=x=>store[x.id+'_'+lv],star=s=>s>=85?'★★★':s>=60?'★★☆':s>=30?'★☆☆':'☆☆☆';app.innerHTML=`<button class="ghost" id="bk">← Perfil</button><h1>🏆 Mis récords</h1><div style="display:flex;gap:6px">${[1,2,3,4,5].map(n=>`<button data-l="${n}" style="flex:1;padding:10px;border-radius:10px;border:${n==lv?'2px solid var(--p)':'1px solid var(--b)'};background:${n==lv?'var(--b)':'var(--c)'}">Nivel ${n}</button>`).join('')}</div><p class="m">Mejor puntaje por juego en el nivel ${lv}. Jugados: ${GAMES.filter(x=>sc(x)!=null).length}/${GAMES.length}.</p>${Object.entries(CATS).map(([k,[n,col]])=>`<h2 style="color:${col}">${n}</h2>${GAMES.filter(x=>x.c==k).map(x=>`<div class="bar" style="margin:4px 0"><span style="width:auto;flex:1">${x.n}</span><b>${sc(x)??'–'}</b><span style="width:48px;color:#f59e0b">${sc(x)==null?'':star(sc(x))}</span></div>`).join('')}`).join('')}`;$('#bk').onclick=perfil;app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>recs(+b.dataset.l))}
function logros(){g++;const s=lgS(store),n=LOG.filter(l=>l[3](s)).length;app.innerHTML=`<button class="ghost" id="bk">← Perfil</button><h1>🎖️ Logros</h1><p class="m">${n}/${LOG.length} desbloqueados</p>${LOG.map(l=>{const o=l[3](s);return`<div class="card" style="display:flex;gap:12px;align-items:center;opacity:${o?1:.45}"><span style="font-size:1.8rem;filter:${o?'none':'grayscale(1)'}">${l[0]}</span><div><b>${l[1]}</b><small>${l[2]}</small></div></div>`}).join('')}`;$('#bk').onclick=perfil}
function rank(){g++;const Q=UD.list.map(u=>{const d=u.id==UD.cur?store:rd('ng_u_'+u.id);return{u,p:pts(d),t:d.tot||0}}).sort((a,b)=>b.p-a.p);app.innerHTML=`<button class="ghost" id="bk">← Perfil</button><h1>👥 Ranking</h1><p class="m">Perfiles de este dispositivo, por puntos de récord (suma de tus mejores puntajes).</p>${Q.map((r,i)=>`<div class="card" style="display:flex;gap:12px;align-items:center"><b>${i+1}</b><span style="font-size:1.6rem">${r.u.av}</span><div style="flex:1"><b>${esc(r.u.name)}</b><small>${r.t} partidas</small></div><b>${r.p}</b></div>`).join('')||'<p class="m">Aún no hay perfiles.</p>'}`;$('#bk').onclick=perfil}
function resp(fl){g++;const u=usr(),ex=JSON.stringify({app:'NeuroGym',v:1,name:u?u.name:'Invitado',av:u?u.av:'👤',c:u?u.c:Date.now(),data:store});app.innerHTML=`<button class="ghost" id="bk">← ${fl?'Acceso':'Perfil'}</button><h1>💾 Respaldo</h1><p class="m">Tu progreso vive en este navegador. Para llevarlo a otro dispositivo, o no perderlo si borras los datos del navegador, guarda un respaldo.</p>${fl?'':`<div class="card"><b>Exportar</b><textarea id="ex" readonly rows="4" style="width:100%;margin:8px 0;font:12px monospace">${esc(ex)}</textarea><button class="big" id="cp">Copiar respaldo</button><button class="big" id="dl">Descargar archivo</button></div>`}<div class="card"><b>Importar</b><p class="m">Pega el texto del respaldo o elige el archivo. Se crea un perfil nuevo; no se borra nada.</p><textarea id="ib" rows="3" style="width:100%;margin:8px 0;font:12px monospace"></textarea><input type="file" id="fl" accept=".json,.txt,application/json"><button class="big" id="go">Importar</button><p class="m" id="ms"></p></div>`;
$('#bk').onclick=()=>fl?acceso():perfil();
if(!fl){$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(ex);$('#cp').textContent='¡Copiado!'}catch(e){$('#ex').select();try{document.execCommand('copy')}catch(e2){}}};$('#dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ex],{type:'application/json'}));a.download='neurogym-respaldo.json';a.click()}catch(e){}$('#ms').textContent='Si no se descargó, usa «Copiar respaldo».'}}
$('#fl').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#ib').value=t)};
$('#go').onclick=()=>{try{const j=JSON.parse($('#ib').value);if(j.app!='NeuroGym'||!j.data||typeof j.data!='object')throw 0;const id='u'+Date.now().toString(36);UD.list.push({id,name:uname(String(j.name||'Importado')),av:AV.includes(j.av)?j.av:AV[0],pin:'',c:+j.c||Date.now()});LS.s('ng_u_'+id,JSON.stringify(j.data));udS();entrar(id)}catch(e){$('#ms').textContent='Respaldo no válido. Copia el texto completo.'}}}
const pool=()=>store.sel&&store.sel.length?GAMES.filter(x=>store.sel.includes(x.id)):GAMES,pick1=()=>{const L=pool().filter(x=>x.id!=cur);return(L.length?S(L):S(GAMES))[0].id};
function sesion(){g++;const sel=new Set(store.sel||[]),up=()=>$('#cnt').textContent=sel.size;app.innerHTML=`<button class="ghost" id="bk">← Inicio</button><h1>🎯 Mi selección</h1><p class="m"><b id="cnt">${sel.size}</b> juegos elegidos (sin marcar = todos). Marca una categoría o juegos sueltos.</p><button class="big" id="pl">▶ Jugar en el orden elegido</button><button class="big" id="rn" style="background:var(--c);color:var(--t);border:2px solid var(--p)">🔀 Aleatorio sin parar (solo estos)</button><button class="ghost" id="cl">Limpiar selección</button>${Object.entries(CATS).map(([k,[n,col]])=>{const L=GAMES.filter(x=>x.c==k);return`<h2 style="color:${col}"><label><input type="checkbox" data-c="${k}" style="width:auto"${L.every(x=>sel.has(x.id))?' checked':''}> ${n}</label></h2>${L.map(x=>`<label style="display:block;padding:3px 0"><input type="checkbox" data-g="${x.id}" style="width:auto"${sel.has(x.id)?' checked':''}> ${x.n}</label>`).join('')}`}).join('')}`;
app.querySelectorAll('[data-g]').forEach(e=>e.onchange=()=>{e.checked?sel.add(e.dataset.g):sel.delete(e.dataset.g);up()});
app.querySelectorAll('[data-c]').forEach(e=>e.onchange=()=>{GAMES.filter(x=>x.c==e.dataset.c).forEach(x=>{e.checked?sel.add(x.id):sel.delete(x.id);app.querySelector('[data-g="'+x.id+'"]').checked=e.checked});up()});
const go=r=>{store.sel=[...sel];save();const L=GAMES.filter(x=>!sel.size||sel.has(x.id)).map(x=>x.id);if(r){INF=1;start(S(L)[0],[])}else{INF=0;start(L.shift(),L)}};
$('#pl').onclick=()=>go(0);$('#rn').onclick=()=>go(1);$('#cl').onclick=()=>{sel.clear();app.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=false);up()};$('#bk').onclick=home}
const FBC={key:'',proj:''},FB=()=>{try{const c=JSON.parse(LS.g('ng_fb'));if(c&&c.key&&c.proj)return c}catch(e){}return FBC};
const fsU=c=>`https://firestore.googleapis.com/v1/projects/${c.proj}/databases/(default)/documents/users/`;
async function fbA(mode,em,pw){const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${mode}?key=${FB().key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})}),j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'ERROR');return j}
async function fbT(u){if(u.cl.exp>Date.now()+6e4)return u.cl.tok;const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB().key}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(u.cl.rt)}),j=await r.json();if(!r.ok)throw new Error('SESION');u.cl.tok=j.id_token;u.cl.rt=j.refresh_token;u.cl.exp=Date.now()+j.expires_in*1e3;udS();return u.cl.tok}
const mrg=(a,b)=>{const o={...b,...a};for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[k],y=b[k];if(KRE.test(k)||['tot','ms','mh','nl'].includes(k))o[k]=Math.max(+x||0,+y||0);else if(k=='log'){o.log={...y,...x};for(const d in y)o.log[d]=Math.max((x||{})[d]||0,y[d])}else if(k=='hist'){o.hist={...y,...x};for(const i in y)if(!(x&&x[i]&&x[i].length>=y[i].length))o.hist[i]=y[i]}else if(k=='ad')o.ad={...y,...x}}return o};
async function sync(){const u=usr();if(!u||!u.cl)throw new Error('SIN CUENTA');const url=fsU(FB())+u.cl.uid,H={Authorization:'Bearer '+await fbT(u)};let cloud={};const r=await fetch(url,{headers:H});if(r.ok){const j=await r.json();try{cloud=JSON.parse(j.fields.data.stringValue)}catch(e){}}else if(r.status!=404)throw new Error('LEER '+r.status);
store=mrg(store,cloud);save();const w=await fetch(url+'?updateMask.fieldPaths=data',{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(store)}}})});if(!w.ok)throw new Error('ESCRIBIR '+w.status);return'Sincronizado a las '+new Date().toLocaleTimeString('es')}
function nube(msg){g++;const u=usr(),ok=FB().key;app.innerHTML=`<button class="ghost" id="bk">← Perfil</button><h1>☁️ Sincronización</h1>${!u?'<p class="m">Crea un perfil primero (no disponible en modo invitado).</p>':!ok?`<p class="m">Para sincronizar entre dispositivos necesitas un proyecto gratuito de Firebase (plan Spark, sin tarjeta). 1) console.firebase.google.com → Agregar proyecto. 2) Authentication → Comenzar → Correo y contraseña → Habilitar. 3) Firestore Database → Crear base de datos → pestaña Reglas → pega esto y Publica: <code>rules_version='2';service cloud.firestore{match /databases/{d}/documents{match /users/{uid}{allow read,write:if request.auth!=null&&request.auth.uid==uid;}}}</code> 4) Configuración del proyecto → Tus apps → Web → copia apiKey y projectId aquí.</p><input id="ky" placeholder="apiKey" style="margin:6px 0"><input id="pj" placeholder="projectId"><button class="big" id="sv">Guardar configuración</button>`:u.cl?`<p>Cuenta: <b>${esc(u.cl.em)}</b></p><button class="big" id="sy">Sincronizar ahora</button><button class="ghost" id="dc">Desconectar de la nube</button>`:`<input id="em" type="email" placeholder="Correo" style="margin:6px 0"><input id="pw" type="password" placeholder="Contraseña (6 o más caracteres)"><button class="big" id="su">Crear cuenta en la nube</button><button class="big" id="si">Ya tengo cuenta: entrar</button>`}<p class="m" id="ms">${msg||''}</p><small>Funciona solo en la app publicada en tu propio sitio (GitHub Pages o Netlify), no dentro de claude.ai. Se sincroniza al entrar y al terminar cada juego.</small>`;
$('#bk').onclick=perfil;const ms=t=>$('#ms').textContent=t;if($('#sv'))$('#sv').onclick=()=>{LS.s('ng_fb',JSON.stringify({key:$('#ky').value.trim(),proj:$('#pj').value.trim()}));nube()};
const go=async m=>{try{ms('Conectando…');const j=await fbA(m,$('#em').value.trim(),$('#pw').value);u.cl={uid:j.localId,rt:j.refreshToken,tok:j.idToken,exp:Date.now()+j.expiresIn*1e3,em:j.email};udS();await sync();nube('Listo: cuenta conectada y sincronizada.')}catch(e){ms('Error: '+e.message)}};
if($('#su')){$('#su').onclick=()=>go('signUp');$('#si').onclick=()=>go('signInWithPassword')}
if($('#sy'))$('#sy').onclick=async()=>{try{ms('Sincronizando…');nube(await sync())}catch(e){ms('Error: '+e.message)}};if($('#dc'))$('#dc').onclick=()=>{delete u.cl;udS();nube()}}
theme();boot();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
